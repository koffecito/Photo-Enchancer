name: Enhance photos

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model
        type: choice
        options:
          - anime
          - photo
        default: anime
      overwrite:
        description: Overwrite existing results in output/
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL: ${{ inputs.model }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ inputs.model }}

      - name: Download weights
        run: |
          mkdir -p weights
          if [ "$MODEL" = "photo" ]; then NAME=realesr-general-x4v3; else NAME=realesr-animevideov3; fi
          test -f weights/$NAME.pth || curl -L -o weights/$NAME.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/$NAME.pth

      - run: python enhance.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Add enhanced photos"
          git push
